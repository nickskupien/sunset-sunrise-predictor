name: Lighthouse CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".lighthouserc.cjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/lighthouse-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".lighthouserc.cjs"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/lighthouse-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_ENV: production
      API_BASE_URL: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @sunset/web build

      - name: Collect lighthouse reports
        run: pnpm exec lhci collect --config=.lighthouserc.cjs

      - name: Assert lighthouse budgets
        run: pnpm exec lhci assert --config=.lighthouserc.cjs

      - name: Upload to LHCI server
        if: ${{ secrets.LHCI_SERVER_BASE_URL != '' && secrets.LHCI_TOKEN != '' }}
        run: pnpm exec lhci upload --config=.lighthouserc.cjs --target=lhci --serverBaseUrl="$LHCI_SERVER_BASE_URL" --token="$LHCI_TOKEN"
        env:
          LHCI_SERVER_BASE_URL: ${{ secrets.LHCI_SERVER_BASE_URL }}
          LHCI_TOKEN: ${{ secrets.LHCI_TOKEN }}

      - name: Upload to temporary public storage
        if: ${{ !(secrets.LHCI_SERVER_BASE_URL != '' && secrets.LHCI_TOKEN != '') }}
        run: pnpm exec lhci upload --config=.lighthouserc.cjs --target=temporary-public-storage

      - name: Upload raw LHCI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-artifacts
          path: .lighthouseci/
          if-no-files-found: warn
